[package]
name = "brod"
version = "0.1.0"
edition = "2024"
default-run="brod"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
enum-display = "0.2.1"
once_cell = "1"
reedline = "0.47.0"

[[bin]]
name = "brod"
path = "src/bin/brod.rs"

[[bin]]
name = "formatter"
path = "src/bin/formatter.rs"
